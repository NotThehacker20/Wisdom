name: App de Windows (.exe)

on:
  push:
    branches: [main]
    paths:
      - index.html
      - css/**
      - js/**
      - desktop/**
      - package.json
      - package-lock.json
      - .github/workflows/windows-exe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TutorSMR
          path: dist/TutorSMR.exe
      - name: Publicar en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --cleanup-tag --yes || true
          gh release create windows dist/TutorSMR.exe \
            --target "$GITHUB_SHA" \
            --title "Tutor SMR para Windows" \
            --notes "Descarga TutorSMR.exe y ábrelo con doble clic. No necesita instalación."
